{% extends "base.html" %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="p-6 border-b border-slate-100 bg-slate-50">
        <h2 class="text-xl font-semibold text-slate-800">Employee & Employer (DDO) Details</h2>
        <p class="text-sm text-slate-500 mt-1">Enter your details and DDO TAN. The system will auto-fill DDO info if it exists in our cache.</p>
    </div>

        <!-- Section 2: Employer Details (The TAN Cache Magic) -->
        <h3 class="text-sm font-semibold text-slate-700 uppercase tracking-wide mb-4 border-b pb-2">2. Employer / DDO Details</h3>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-1">DDO TAN Number <span class="text-red-500">*</span></label>
            <div class="relative max-w-sm">
                <input type="text" id="tan_number" placeholder="e.g. RNCEDNK91" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-prashasan-base focus:ring-1 focus:ring-prashasan-base uppercase font-mono">
                <div id="tan_status_icon" class="absolute right-3 top-2.5 hidden">
                    <!-- Loading or Check icon will be injected here via JS -->
                </div>
            </div>
            <p id="tan_message" class="text-xs text-slate-500 mt-1">Enter TAN to auto-fetch DDO details.</p>
        </div>

        <!-- DDO Fields (Initially empty/disabled) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-4 rounded-lg border border-slate-200" id="ddo_form_area">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">DDO Officer Name</label>
                <input type="text" id="officer_name" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-prashasan-base focus:ring-1 focus:ring-prashasan-base transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Officer Father Name</label>
                <input type="text" id="officer_father_name" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-prashasan-base focus:ring-1 focus:ring-prashasan-base">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Employer / DDO Center Name</label>
                <input type="text" id="employer_name" placeholder="e.g. K.B. +2 High School, Arki" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-prashasan-base focus:ring-1 focus:ring-prashasan-base">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Designation</label>
                <input type="text" id="designation" placeholder="e.g. Headmaster" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-prashasan-base focus:ring-1 focus:ring-prashasan-base">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">Full Employer Address</label>
                <input type="text" id="employer_address" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-prashasan-base focus:ring-1 focus:ring-prashasan-base">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Employer PAN <span class="text-slate-400 font-normal">(Optional)</span></label>
                <input type="text" id="employer_pan" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-prashasan-base focus:ring-1 focus:ring-prashasan-base uppercase font-mono">
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center">
            <button class="text-slate-500 font-medium hover:text-slate-800 transition-colors">
                &larr; Back to Review
            </button>
            <button onclick="proceedToPayment(event)" class="btn">
                Proceed to Payment
            </button>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const tanInput = document.getElementById("tan_number");
        const statusIcon = document.getElementById("tan_status_icon");
        
        // Fixed IDs to exactly match your HTML inputs
        const ddoName = document.getElementById("officer_name"); 
        const ddoDesig = document.getElementById("designation");
        const officeAddress = document.getElementById("employer_address");
        const empName = document.getElementById("employer_name");

        if (tanInput) {
            tanInput.addEventListener("blur", async (e) => {
                const tan = e.target.value.trim().toUpperCase();
                e.target.value = tan; // convert to uppercase visually
                
                if (tan.length >= 10) {
                    statusIcon.innerHTML = '⏳';
                    statusIcon.classList.remove("hidden");

                    try {
                        const response = await fetch(`/api/employer/${tan}`);
                        
                        if (response.ok) {
                            const data = await response.json();
                            // Auto-fill the fields properly
                            if (ddoName) ddoName.value = data.officer_name || "";
                            if (ddoDesig) ddoDesig.value = data.designation || "";
                            if (officeAddress) officeAddress.value = data.employer_address || data.address || "";
                            if (empName) empName.value = data.employer_name || "";
                            
                            statusIcon.innerHTML = '✅';
                            statusIcon.classList.add("text-emerald-500");
                        } else {
                            statusIcon.innerHTML = '❌';
                            statusIcon.classList.add("text-slate-400");
                        }
                    } catch (error) {
                        console.error("TAN lookup failed:", error);
                        statusIcon.classList.add("hidden");
                    }
                } else {
                    statusIcon.classList.add("hidden");
                }
            });
        }
    });

    // Handle form submission, save to database, and redirect to payment
    async function proceedToPayment(event) {
        if(event) event.preventDefault();

        // 1. Form se data uthao
        const tan = document.getElementById("tan_number").value.trim();
        const officer_name = document.getElementById("officer_name").value.trim();
        const officer_father_name = document.getElementById("officer_father_name").value.trim();
        const employer_name = document.getElementById("employer_name").value.trim();
        const designation = document.getElementById("designation").value.trim();
        const employer_address = document.getElementById("employer_address").value.trim();
        const employer_pan = document.getElementById("employer_pan").value.trim();

        // TAN zaroori hai
        if (!tan) {
            alert("Please enter the DDO TAN Number.");
            return;
        }

        // 2. Data ko API bhejne ke liye pack karo
        const payload = {
            tan: tan,
            officer_name: officer_name,
            officer_father_name: officer_father_name,
            employer_name: employer_name,
            designation: designation,
            employer_address: employer_address,
            pan: employer_pan
        };

        try {
            // 3. Backend API ko data bhejo taaki database me hamesha ke liye save ho jaye
            await fetch("/api/employer", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });
            
            // 4. Data save hone ke baad safely asali ID lekar Payment page par jao!
            window.location.href = `/payment?user_id={{ user_id }}`;
            
        } catch (error) {
            console.error("Error saving DDO details:", error);
            // Backup redirect agar network issue aaya
            window.location.href = `/payment?user_id={{ user_id }}`;
        }
    }
</script>
{% endblock %}
