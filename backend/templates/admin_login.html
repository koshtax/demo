{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 w-full max-w-md">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800">Admin Login</h2>
            <p class="text-sm text-slate-500 mt-1">Prashasan Form 16 Portal</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded-md text-sm mb-4 border border-red-200 text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1 uppercase tracking-wide">Admin ID</label>
                <input type="text" name="username" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-md px-4 py-2.5 focus:ring-2 focus:ring-prashasan-base outline-none transition">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1 uppercase tracking-wide">Password</label>
                <input type="password" name="password" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-md px-4 py-2.5 focus:ring-2 focus:ring-prashasan-base outline-none transition">
            </div>

            <button type="submit" class="w-full bg-prashasan-base hover:bg-prashasan-hover text-white py-2.5 rounded-md font-semibold shadow transition-colors mt-4">
                Secure Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
